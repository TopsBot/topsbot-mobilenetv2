/**:
  ros__parameters:
    input_msg: tb_img
    input_topic: /tbmem_img
    tb_img_profile: "480p"
    frame_id: camera
    detections_topic: /detections
    classifications_topic: /classifications
    frame_skip: 0
    enable_profile: true

    model.backend: mobilenet
    model.name: mobilenetv2
    model.type: mobilenetv2
    model.path: ~/topsbot/models/mobilenetv2_int8.nb
    npu.device_ids: [0]

    load_balancer.strategy: least_loaded
    load_balancer.queue_size: 2
    load_balancer.drop_policy: drop_oldest

    preprocess.engine: tacv_dma
    preprocess.input_width: 224
    preprocess.input_height: 224
    preprocess.csc_type: ycbcr2rgb_bt601
    preprocess.interpolation: linear
    preprocess.scale: 0.003921568627
    preprocess.mean: [0.485, 0.456, 0.406]
    preprocess.std: [0.229, 0.224, 0.225]

    postprocess.top_k: 5
    postprocess.labels_path: package://topsbot_mobilenet_cls/config/imagenet_labels.txt
